name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$PROVISIONING_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Locate Xcode project
        id: locate
        run: |
          set -euo pipefail
          project=$(find . -maxdepth 4 -type d -name '*.xcodeproj' | head -1)
          workspace=$(find . -maxdepth 4 -type d -name '*.xcworkspace' | head -1)
          if [ -n "$workspace" ]; then
            echo "container=$workspace" >> "$GITHUB_OUTPUT"
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
          elif [ -n "$project" ]; then
            echo "container=$project" >> "$GITHUB_OUTPUT"
            echo "kind=project" >> "$GITHUB_OUTPUT"
          else
            echo 'No .xcodeproj or .xcworkspace was found. A Swift Package alone is not an installable iOS application.' >&2
            exit 1
          fi

      - name: Select scheme
        id: scheme
        run: |
          set -euo pipefail
          container='${{ steps.locate.outputs.container }}'
          if [ '${{ steps.locate.outputs.kind }}' = workspace ]; then
            schemes=$(xcodebuild -workspace "$container" -list | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}')
          else
            schemes=$(xcodebuild -project "$container" -list | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}')
          fi
          test -n "$schemes"
          echo "name=$schemes" >> "$GITHUB_OUTPUT"

      - name: Archive application
        run: |
          set -euo pipefail
          container='${{ steps.locate.outputs.container }}'
          archive="$RUNNER_TEMP/PainelSport.xcarchive"
          if [ '${{ steps.locate.outputs.kind }}' = workspace ]; then
            xcodebuild -workspace "$container" -scheme '${{ steps.scheme.outputs.name }}' -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM='${{ secrets.TEAM_ID }}'
          else
            xcodebuild -project "$container" -scheme '${{ steps.scheme.outputs.name }}' -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM='${{ secrets.TEAM_ID }}'
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PainelSport.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: painel-sport-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
