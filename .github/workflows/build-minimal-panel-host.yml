name: Build Minimal Panel Host

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build minimal panel host
        run: |
          set -euo pipefail
          make -f Makefile.panel clean all FINALPACKAGE=1
          DYLIB=$(find .theos/obj -type f -name PanelHost.dylib -print -quit)
          test -s "$DYLIB"
          cp "$DYLIB" "$GITHUB_WORKSPACE/PanelHost.dylib"

      - name: Audit dependencies and launch surface
        run: |
          set -euo pipefail
          DYLIB="$GITHUB_WORKSPACE/PanelHost.dylib"
          otool -L "$DYLIB" | tee "$RUNNER_TEMP/panelhost-dependencies.txt"
          ! grep -Eq 'Orion|CydiaSubstrate|SwiftProtobuf|EeveeSpotify' "$RUNNER_TEMP/panelhost-dependencies.txt"
          grep -F '/System/Library/Frameworks/MediaPlayer.framework/MediaPlayer' "$RUNNER_TEMP/panelhost-dependencies.txt" >/dev/null
          strings "$DYLIB" > "$RUNNER_TEMP/panelhost-strings.txt"
          for marker in 0wwPcA6wtMf6HUMpIRdeP7; do
            count=$(grep -Fc "$marker" "$RUNNER_TEMP/panelhost-strings.txt" || true)
            echo "$marker count=$count"
            test "$count" -ge 1
          done
          orion_count=$(grep -Fc 'orion_init' "$RUNNER_TEMP/panelhost-strings.txt" || true)
          echo "orion_init count=$orion_count"
          test "$orion_count" -eq 0
          file "$DYLIB" > "$RUNNER_TEMP/panelhost-file.txt"
          cat "$RUNNER_TEMP/panelhost-file.txt"
          grep -F 'arm64' "$RUNNER_TEMP/panelhost-file.txt" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Minimal-PanelHost
          path: PanelHost.dylib
          if-no-files-found: error
          compression-level: 0
